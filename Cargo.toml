[package]
name = "cassette"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
image = "0.25.10"
tokio = { version = "1.47.1", features = [
    "io-util",
    "fs",
    "macros",
    "rt-multi-thread",
    "process",
    "io-std",
] }
tokio-util = "0.7.16"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "^1.0"
